<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="dp-title dp-desc">
  <title id="dp-title">Programako zure eguna: bisitaren kronograma</title>
  <desc id="dp-desc">Bi zutabeko kronograma, 1. egunaren (Santiago Ospitalea, gaua) eta 2. egunaren (Txagorritxu Ospitalea, goiza) uneak erakusten ditu.</desc>

  <rect x="0" y="0" width="640" height="520" fill="none"/>

  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#7A5BA3" text-anchor="middle">
    <text x="160" y="36">1. eguna</text>
    <text x="480" y="36">2. eguna</text>
  </g>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.7" text-anchor="middle">
    <text x="160" y="52">Santiago Ospitalea · gaua</text>
    <text x="480" y="52">Txagorritxu Ospitalea · goiza</text>
  </g>

  <line x1="80" y1="75" x2="80" y2="420" stroke="#7A5BA3" stroke-width="2" opacity="0.35"/>
  <line x1="400" y1="75" x2="400" y2="480" stroke="#7A5BA3" stroke-width="2" opacity="0.35"/>

  <!-- Hito 1: Santiago Ospitalera iristea -->
  <g>
    <circle cx="80" cy="105" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <path d="M 74 109 L 74 103 L 80 97 L 86 103 L 86 109 Z" fill="none" stroke="#7A5BA3" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="105" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Santiago Ospitalera iristea</text>
    <text x="105" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">20:30 · afalduta etorri</text>
  </g>

  <!-- Hito 2: Castilla dk. — harrera -->
  <g>
    <circle cx="80" cy="205" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <circle cx="80" cy="200" r="3.5" fill="none" stroke="#7A5BA3" stroke-width="1.3"/>
    <path d="M 74 212 Q 74 208 80 208 Q 86 208 86 212" fill="none" stroke="#7A5BA3" stroke-width="1.3" stroke-linecap="round"/>
    <text x="105" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Castilla dk. — harrera</text>
    <text x="105" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">Lo Unitatera laguntzea</text>
  </g>

  <!-- Hito 3: Adostasuna + sentsoreak -->
  <g>
    <circle cx="80" cy="305" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <path d="M 74 299 L 83 299 L 86 302 L 86 311 L 74 311 Z" fill="none" stroke="#7A5BA3" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="77" y1="304" x2="83" y2="304" stroke="#7A5BA3" stroke-width="1"/>
    <line x1="77" y1="307" x2="83" y2="307" stroke="#7A5BA3" stroke-width="1"/>
    <text x="105" y="301" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Adostasuna + sentsoreak</text>
    <text x="105" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">CI sinatzea eta sentsoreak jartzea</text>
  </g>

  <!-- Hito 4: Gaueko polisomnografia -->
  <g>
    <circle cx="80" cy="405" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <path d="M 84 400 Q 77 400 77 406 Q 77 412 84 412 Q 81 409 81 406 Q 81 403 84 400 Z" fill="none" stroke="#7A5BA3" stroke-width="1.3"/>
    <text x="105" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Gaueko polisomnografia</text>
    <text x="105" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">8:00ak arte atseden</text>
  </g>

  <!-- Hito 1 Día 2: Gosaria eta lekualdaketa -->
  <g>
    <circle cx="400" cy="105" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <path d="M 393 105 L 407 105 M 403 101 L 407 105 L 403 109" fill="none" stroke="#7A5BA3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="425" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Gosaria eta lekualdaketa</text>
    <text x="425" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">8:00 · Txagorritxura</text>
  </g>

  <!-- Hito 2 Día 2: Kortazar dk. — elkarrizketa -->
  <g>
    <circle cx="400" cy="183" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <path d="M 393 182 Q 393 178 397 178 L 403 178 Q 407 178 407 182 L 407 185 Q 407 188 403 188 L 399 188 L 396 190 L 396 188 Q 393 188 393 185 Z" fill="none" stroke="#7A5BA3" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="425" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Kortazar dk. — elkarrizketa</text>
    <text x="425" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">8:30 · berrikuspena eta adostasunak</text>
  </g>

  <!-- Hito 3 Día 2: Odol-erauzketa -->
  <g>
    <circle cx="400" cy="261" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <path d="M 400 255 Q 396 260 396 264 Q 396 268 400 268 Q 404 268 404 264 Q 404 260 400 255 Z" fill="none" stroke="#7A5BA3" stroke-width="1.3"/>
    <text x="425" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Odol-erauzketa</text>
    <text x="425" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">urte horretan egokitzen bada</text>
  </g>

  <!-- Hito 4 Día 2: Erresonantzia magnetikoa -->
  <g>
    <circle cx="400" cy="339" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <circle cx="400" cy="339" r="6" fill="none" stroke="#7A5BA3" stroke-width="1.3"/>
    <circle cx="400" cy="339" r="2.5" fill="#7A5BA3"/>
    <text x="425" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Erresonantzia magnetikoa (EMN)</text>
    <text x="425" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">urte horretan egokitzen bada</text>
  </g>

  <!-- Hito 5 Día 2: Giltzurrun-zilb. zulaketa -->
  <g>
    <circle cx="400" cy="417" r="14" fill="#E1D6EC" stroke="#7A5BA3" stroke-width="2"/>
    <rect x="397" y="411" width="6" height="12" rx="1" fill="none" stroke="#7A5BA3" stroke-width="1.3"/>
    <line x1="397" y1="418" x2="403" y2="418" stroke="#7A5BA3" stroke-width="1"/>
    <text x="425" y="413" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Giltzurrun-zilb. zulaketa</text>
    <text x="425" y="429" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">urte horretan egokitzen bada</text>
  </g>

  <!-- Hito final: Alta eta etxera itzulera -->
  <g>
    <circle cx="400" cy="495" r="14" fill="#7A5BA3"/>
    <path d="M 395 495 L 399 499 L 406 492" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="425" y="491" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3A3A3A">Alta eta etxera itzulera</text>
    <text x="425" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7A5BA3" opacity="0.8">itxiera · bazkaldu aurretik</text>
  </g>
</svg>
