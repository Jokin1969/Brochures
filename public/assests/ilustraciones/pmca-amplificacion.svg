<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="pmca-title pmca-desc">
  <title id="pmca-title">Amplificación cíclica de la señal de los priones (PMCA)</title>
  <desc id="pmca-desc">Esquema de amplificación cíclica: una semilla mínima se multiplica progresivamente en sucesivas rondas hasta hacerse claramente visible.</desc>

  <defs>
    <style>
      .seed { fill: #4A8B6F; }
      .ring { fill: none; stroke: #A8D5BA; stroke-width: 1.2; opacity: 0.5; }
      .arrow { stroke: #7FB89A; stroke-width: 1.4; fill: none; stroke-linecap: round; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #5A8A75; opacity: 0.7; }
    </style>
  </defs>

  <!-- Ronda 1: una sola semilla -->
  <g transform="translate(60, 110)">
    <circle class="ring" cx="0" cy="0" r="34"/>
    <circle class="seed" cx="0" cy="0" r="3"/>
  </g>
  <text class="label" x="60" y="180" text-anchor="middle">·</text>

  <!-- Flecha 1 -->
  <path class="arrow" d="M 105 110 Q 130 100, 155 110"/>
  <path class="arrow" d="M 150 105 L 158 110 L 150 115"/>

  <!-- Ronda 2: tres semillas -->
  <g transform="translate(190, 110)">
    <circle class="ring" cx="0" cy="0" r="34"/>
    <circle class="seed" cx="-8" cy="-4" r="3"/>
    <circle class="seed" cx="6" cy="-6" r="3"/>
    <circle class="seed" cx="0" cy="8" r="3"/>
  </g>
  <text class="label" x="190" y="180" text-anchor="middle">··</text>

  <!-- Flecha 2 -->
  <path class="arrow" d="M 235 110 Q 260 100, 285 110"/>
  <path class="arrow" d="M 280 105 L 288 110 L 280 115"/>

  <!-- Ronda 3: muchas semillas -->
  <g transform="translate(320, 110)">
    <circle class="ring" cx="0" cy="0" r="34"/>
    <circle class="seed" cx="-12" cy="-8" r="2.5"/>
    <circle class="seed" cx="-2" cy="-14" r="2.5"/>
    <circle class="seed" cx="10" cy="-6" r="2.5"/>
    <circle class="seed" cx="14" cy="6" r="2.5"/>
    <circle class="seed" cx="4" cy="12" r="2.5"/>
    <circle class="seed" cx="-8" cy="10" r="2.5"/>
    <circle class="seed" cx="-14" cy="2" r="2.5"/>
    <circle class="seed" cx="0" cy="0" r="2.5"/>
  </g>
  <text class="label" x="320" y="180" text-anchor="middle">···</text>

  <!-- Flecha 3 -->
  <path class="arrow" d="M 365 110 Q 390 100, 415 110"/>
  <path class="arrow" d="M 410 105 L 418 110 L 410 115"/>

  <!-- Ronda 4: enjambre, claramente detectable -->
  <g transform="translate(470, 110)">
    <circle class="ring" cx="0" cy="0" r="34" stroke="#7FB89A" stroke-width="1.6" opacity="0.8"/>
    <circle class="seed" cx="-18" cy="-10" r="2.2"/>
    <circle class="seed" cx="-10" cy="-18" r="2.2"/>
    <circle class="seed" cx="2" cy="-20" r="2.2"/>
    <circle class="seed" cx="14" cy="-14" r="2.2"/>
    <circle class="seed" cx="20" cy="-4" r="2.2"/>
    <circle class="seed" cx="22" cy="8" r="2.2"/>
    <circle class="seed" cx="14" cy="18" r="2.2"/>
    <circle class="seed" cx="2" cy="22" r="2.2"/>
    <circle class="seed" cx="-10" cy="20" r="2.2"/>
    <circle class="seed" cx="-20" cy="12" r="2.2"/>
    <circle class="seed" cx="-22" cy="0" r="2.2"/>
    <circle class="seed" cx="-6" cy="-6" r="2.2"/>
    <circle class="seed" cx="6" cy="-2" r="2.2"/>
    <circle class="seed" cx="0" cy="6" r="2.2"/>
    <circle class="seed" cx="-8" cy="6" r="2.2"/>
    <circle class="seed" cx="8" cy="10" r="2.2"/>
  </g>
  <text class="label" x="470" y="180" text-anchor="middle">····</text>
</svg>
