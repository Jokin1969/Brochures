name: Build language PDFs

# Regenera los PDF por idioma (public/assets/pdfs/programa-*.pdf) a partir
# de las páginas web ya traducidas, cada vez que cambia el contenido en main.
# Así el PDF descargable siempre refleja la última versión publicada.

on:
  push:
    branches: [main]
    paths:
      - 'public/portadores.html'
      - 'public/*/portadores.html'
      - 'public/css/portadores.css'
      - 'public/css/portadores-programa.css'
      - 'public/js/translations.js'
      - 'scripts/build-pdfs.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pdfs
  cancel-in-progress: false

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDFs
        run: node scripts/build-pdfs.js

      - name: Commit regenerated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/pdfs/*.pdf
          if git diff --cached --quiet; then
            echo "Sin cambios en los PDF."
          else
            git commit -m "chore: regenerate language PDFs [skip ci]"
            git push
          fi
